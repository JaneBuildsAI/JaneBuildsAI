<svg width="100%" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05010D"/>
      <stop offset="30%" stop-color="#0A2A2E"/>
      <stop offset="65%" stop-color="#1B1035"/>
      <stop offset="100%" stop-color="#05010D"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DE0D3" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1000" height="240" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1000" height="240" fill="url(#bg)"/>
    <ellipse cx="150" cy="55" rx="230" ry="150" fill="url(#glowTeal)"/>
    <ellipse cx="860" cy="190" rx="230" ry="150" fill="url(#glowPurple)"/>

    <rect x="0" y="0" width="1000" height="240" fill="none" stroke="#2a2a3a" stroke-width="1"/>

    <rect x="-300" y="0" width="300" height="240" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1300 0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="500" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#7DE0D3">AI ENGINEER</text>
    <text x="500" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#F5F1EA">JANET ELUWOLE</text>
    <text x="500" y="150" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9CA8B4">&gt; LLM systems &#183; RAG &amp; agents &#183; multimodal AI</text>

    <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#D7E4E2">
      <rect x="120" y="185" width="140" height="32" rx="16" fill="#0E1B22" stroke="#2DD4BF" stroke-opacity="0.5"/>
      <circle cx="140" cy="201" r="4" fill="#2DD4BF"/>
      <text x="153" y="206">LLM Engineering</text>

      <rect x="275" y="185" width="140" height="32" rx="16" fill="#12101F" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <circle cx="295" cy="201" r="4" fill="#8B5CF6"/>
      <text x="308" y="206">RAG &amp; Retrieval</text>

      <rect x="430" y="185" width="120" height="32" rx="16" fill="#0E1B22" stroke="#2DD4BF" stroke-opacity="0.5"/>
      <circle cx="450" cy="201" r="4" fill="#2DD4BF"/>
      <text x="463" y="206">AI Agents</text>

      <rect x="565" y="185" width="150" height="32" rx="16" fill="#12101F" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <circle cx="585" cy="201" r="4" fill="#8B5CF6"/>
      <text x="598" y="206">Generative AI</text>

      <rect x="730" y="185" width="150" height="32" rx="16" fill="#0E1B22" stroke="#D4AF7A" stroke-opacity="0.5"/>
      <circle cx="750" cy="201" r="4" fill="#D4AF7A"/>
      <text x="763" y="206">Multimodal AI</text>
    </g>
  </g>
</svg>
